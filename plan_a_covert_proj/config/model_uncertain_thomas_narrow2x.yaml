# model_uncertain_thomas.yaml with every SAMPLED distribution narrowed so its 80% CI
# is 2x smaller, keeping each median exactly where it was. Fixed parameters, choice
# distributions (rho_coding_labor), and the correlation matrix are inherited unchanged.
#
# Narrowing rules (median-preserving in every case):
#   normal            - keep the midpoint, halve each side's distance in linear space
#   lognormal         - keep the geometric mean, halve each side in log space
#                       (e.g. [1, 9] -> [3^0.5, 3^1.5])
#   shifted_lognormal - same log-space rule applied to the CORE ci80 (the spec's ci80 is
#                       on the lognormal part, so the full median shift+core_median is kept)
#   beta              - halve the q10-q90 interval around the (unchanged) median in linear
#                       space, then refit (alpha, beta) on the same [min, max] support with
#                       the production _fit_beta_shapes_ci80 so it stays a Beta. Both betas
#                       here are symmetric, so the median (0.5 on the support) is exact.
#
# Only the changed keys are stated; dist kind, shift, min/max bounds and clip flags all
# inherit from the parent chain via the deep merge. For the betas the parents specify raw
# alpha/beta shapes (which take precedence over ci80), so the narrowed shapes are given
# as alpha/beta too.

parent: "model_uncertain_thomas.yaml"

