# Deterministic scenario branch of model_uncertain_thomas.yaml.
# Every parameter is pinned to its CURRENT median (the URL-anchored central
# values), so the takeoff is fixed — no model uncertainty. Pair with
# covert_uncertain.yaml to vary ONLY the covert knobs over a fixed takeoff.
# Standalone (no parent / no correlation_matrix): a frozen snapshot, so daniel
# edits don't drift it. Regenerate by re-taking medians if the central case moves.

time_range: [2017.0, 2200.0]
input_data: inputs/input_data.csv   # DEFAULT/counterfactual series (sets AC, pause, milestone targets)
per_sample_timeout: 30

parameters:
  ac_time_horizon_minutes:
    dist: fixed
    value: 1230044.7621793437
  horizon_extrapolation_type:
    dist: fixed
    value: "decaying doubling time"
  include_gap:
    dist: fixed
    value: "gap"
  gap_years:
    dist: fixed
    value: 1.103409   # tuned so default AC = 2030.00 on the updated input_data.csv series
  present_day:
    dist: fixed
    value: 2026.0959
  present_horizon:
    dist: fixed
    value: 69.9
  present_doubling_time:
    dist: fixed
    value: 0.3328402169209725
  doubling_difficulty_growth_factor:
    dist: fixed
    value: 0.92
  rho_coding_labor:   # was sampled
    dist: fixed
    value: -2.0
  inf_compute_asymptote:   # was sampled
    dist: fixed
    value: 1000.9999999999998
  inf_labor_asymptote:   # was sampled
    dist: fixed
    value: 15.142135623730947
  inv_compute_anchor_exp_cap:   # was sampled
    dist: fixed
    value: 2.794435844492636
  parallel_penalty:   # was sampled
    dist: fixed
    value: 0.5
  swe_multiplier_at_present_day:   # was sampled
    dist: fixed
    value: 2.0
  coding_automation_efficiency_slope:   # was sampled
    dist: fixed
    value: 3.0000000000000004
  max_serial_coding_labor_multiplier:   # was sampled
    dist: fixed
    value: 100000000.00000018
  automation_interp_type:
