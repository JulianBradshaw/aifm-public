# Covert config — UNCERTAIN-LEAKAGE variant.
#
# Inherits EVERYTHING from covert_scenario_branch.yaml (the pinned scenario values, and
# via it the base covert_uncertain.yaml's detection_grids and silver bullet) and overrides
# ONLY the one knob this variant varies: frac_stolen (the espionage "leakage") — back to
# the base's elicited beta. Edit shared values up the chain, not here.
parent: covert_scenario_branch.yaml

covert_parameters:
