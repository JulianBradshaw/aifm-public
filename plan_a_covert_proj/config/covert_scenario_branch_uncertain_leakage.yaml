  # siphons. UNCERTAIN here: beta on [0,1] fit to an 80% CI (median ≈ 0.67).
  frac_stolen:
    dist: beta
    ci80: [0.36, 0.90]   # median ≈ 0.67
    min: 0.0
    max: 1.0
