#   parameters:
#     - "present_doubling_time"
#     - "doubling_difficulty_growth_factor"
#   correlation_matrix:
#     - [1.00, 0.50]
#     - [0.50, 1.00]
#   correlation_type: "spearman"
#
# ============================================================================
