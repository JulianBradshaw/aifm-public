# FROZEN comparison config for the shared-r detection-model run.
# = covert_bottom_up_2038.yaml fully RESOLVED (no parent chain) as of 2026-07-06,
# with optimal_site_mw and frac_stolen pinned back to the exact spec of baseline run
# d64349a52c96 (bottomup-2038-2k) — a concurrent config refactor moved optimal_site_mw
# to a cdf_points dist mid-flight, which would have confounded the comparison.
# The ONLY semantic delta vs the baseline run is the jointly-fit detection model
# (per-size frailty with pi=0 + one shared per-site slip-up hazard r).
# Safe to delete after the comparison run.
seed: 42
plan_a_input_data: inputs/plan-a.csv
time_range: [2017.0, 2100.0]
bottom_up_compute_config: plan_a_covert_proj/config/covert_compute_bottom_up.yaml
parameters: {}
covert_parameters:
  compute_mode: {dist: fixed, value: bottom_up_estimate}
  total_h100e: {dist: fixed, value: 500000}
  total_h100e_frac: {dist: fixed, value: 0.0126}
  facility_w_per_h100e: {dist: fixed, value: 600}
  dormancy_years: {dist: fixed, value: 0}
  construction_years: {dist: fixed, value: 2}
  frac_stolen:
    dist: beta
    value: 0.67
    ci80: [0.36, 0.9]
    min: 0.0
    max: 1.0
  max_hw_rate: {dist: fixed, value: 0.5}
  legal_scaling_duration: {dist: fixed, value: 8}
  legal_strategy: {dist: fixed, value: target_year_actual_hw}
  legal_mode: {dist: fixed, value: capped}
  max_sw_rate: {dist: fixed, value: 0.0}
  alignment_tax_progress_years: {dist: fixed, value: 0.6}
  post_scaling_externalities_rate: {dist: fixed, value: 0.25}
  min_sw_frac_of_tsp: {dist: fixed, value: 0.2}
  years_before_ac: {dist: fixed, value: 0.838}
  setup_period_years: {dist: fixed, value: 0.838}
  setup_sw_gain_progress_months: {dist: fixed, value: 4}
  optimal_site_mw:
    dist: lognormal
    value: 300
    ci80: [50, 1000]
    min: 10
    max: 1000
    clip_to_bounds: true
detection_grids:
- size_mw: 10
  rows:
  - [1, 0.2, 0.26]
  - [3, 0.25, 0.3]
  - [10, 0.32, 0.37]
  - [100, 0.55, 0.75]
- size_mw: 100
  rows:
  - [1, 0.25, 0.35]
  - [3, 0.35, 0.4]
  - [10, 0.45, 0.67]
  - [100, 0.65, 0.8]
- size_mw: 1000
  rows:
  - [1, 0.4, 0.5]
  - [3, 0.45, 0.7]
  - [10, 0.7, 0.85]
  - [100, 0.85, 0.9]
detection_silver_bullet: {p_mid_pause_to_ted: 0.2, p_used_ted_plus_d: 0.55, delta_years: 2.0,
  ceiling: 0.7}
